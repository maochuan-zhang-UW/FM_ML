# Environment used for the GJI results (Figs 4-7, S3 and the final AxialPolCap model).
name: axialpolcap
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - scipy=1.15.3
  - scikit-learn=1.7.2
  - h5py=3.14.0
  - matplotlib=3.10.6
  - pandas=2.3.2
  - tqdm
  - cartopy          # map panel of Figure 1 only
  - pip
  - pip:
      - tensorflow==2.16.2
      - keras==3.11.3
